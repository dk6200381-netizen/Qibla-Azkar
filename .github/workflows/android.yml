name: Build Qibla Azkar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: unzip -o QiblaAzkar_Android_Project.zip -d .

      - name: Build APK
        run: |
          chmod +x QiblaAzkarAndroid/gradlew
          QiblaAzkarAndroid/gradlew -p QiblaAzkarAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qibla-Azkar-APK
          path: QiblaAzkarAndroid/app/build/outputs/apk/debug/*.apk 
