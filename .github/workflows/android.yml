name: Build Qibla Azkar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find and extract project
        run: |
          ZIP=$(find . -maxdepth 2 -name "QiblaAzkar_Android_Project.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi
          mkdir android-project
          unzip -q "$ZIP" -d android-project
          find android-project -name gradlew -type f

      - name: Build debug APK
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qibla-Azkar-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk 
